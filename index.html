<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="layout">
        <div class="screen">0</div>

        <div class="sections">
            <button class="data ac">AC</button>
            <button class="data">00</button>
            <button class="data">%</button>
            <button class="operator data">÷</button>
            
            <button class="data">7</button>
            <button class="data">8</button>
            <button class="data">9</button>
            <button class="operator data">x</button>
            
            <button class="data">4</button>
            <button class="data">5</button>
            <button class="data">6</button>
            <button class="operator data">_</button>
            
            <button class="data">1</button>
            <button class="data">2</button>
            <button class="data">3</button>
            <button class="operator data">+</button>
            
            <button class="data zero">0</button>
            <button class="data">.</button>
            <button class="operator data">=</button>
            
        </div>

            
        </div>





    </div>
    
</body>
</html>
